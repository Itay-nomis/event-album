# Prometheus + Grafana + Alertmanager + kube-state-metrics, sized for a laptop.
# Chart: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2" # CRDs (ServiceMonitor, PrometheusRule...) first
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 93.3.1
    helm:
      releaseName: kube-prometheus-stack
      valuesObject:
        # k3s runs these control-plane parts inside one binary; nothing to scrape separately
        kubeEtcd:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        defaultRules:
          rules:
            etcd: false
            kubeControllerManager: false
            kubeSchedulerAlerting: false
            kubeSchedulerRecording: false
            kubeProxy: false
        # Docker Desktop's root mount is not "shared", which breaks node-exporter's / mount
        prometheus-node-exporter:
          hostRootFsMount:
            enabled: false
        prometheus:
          prometheusSpec:
            retention: 2d
            retentionSize: 1GB
            scrapeInterval: 30s
            # Pick up ServiceMonitors/PodMonitors/PrometheusRules from every namespace,
            # not only the ones labelled with this Helm release
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            resources:
              requests:
                cpu: 100m
                memory: 400Mi
              limits:
                memory: 1500Mi
        alertmanager:
          alertmanagerSpec:
            retention: 24h
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
        grafana:
          # Password Secret is created by scripts/local-up.ps1 (a password generated by the
          # chart would change on every ArgoCD render).
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              labelValue: "1"
              searchNamespace: ALL
        prometheusOperator:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
        kube-state-metrics:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The CRDs are too big for client-side apply's last-applied annotation
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
