<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מצגת האירוע</title>
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#000; color:#fff; overflow:hidden;
               font-family:system-ui,"Segoe UI",Arial,sans-serif; cursor:none; }
  .slide { position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
           opacity:0; transition:opacity 1.2s ease; }
  .slide.on { opacity:1; }
  #empty { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
           justify-content:center; gap:20px; text-align:center; }
  #empty h1 { margin:0; font-size:4vw; }
  #empty img { width:22vw; max-width:300px; background:#fff; padding:12px; border-radius:16px; }
  #corner { position:absolute; bottom:24px; left:24px; display:flex; align-items:center; gap:12px;
            background:rgba(0,0,0,.55); padding:10px 14px; border-radius:14px; font-size:18px; }
  #corner img { width:90px; height:90px; background:#fff; padding:4px; border-radius:8px; }
  .new { position:absolute; top:24px; right:24px; background:#b5651d; padding:8px 16px;
         border-radius:999px; font-size:20px; opacity:0; transition:opacity .4s; }
  .new.on { opacity:1; }
</style>
</head>
<body>
<img class="slide" id="a"><img class="slide" id="b">
<div id="empty"><h1 id="title"></h1><img id="qr-big" alt=""><div>סרקו והעלו את התמונה הראשונה</div></div>
<div id="corner" hidden><img id="qr-small" alt=""><div>סרקו<br>והעלו תמונות</div></div>
<div class="new" id="new">✨ תמונה חדשה</div>
<script>
const code = location.pathname.split('/')[2];
const SLIDE_MS = 6000;
const photos = [];      // everything shown so far, cycled
const fresh = [];       // just arrived: shown next, before cycling
let idx = 0, front = 'a';

fetch(`/api/events/${code}`).then(r => r.json()).then(ev => {
  document.getElementById('title').textContent = ev.name;
  const qr = `/api/events/${code}/qr`;
  document.getElementById('qr-big').src = qr;
  document.getElementById('qr-small').src = qr;
});

function show(url, isNew) {
  const back = front === 'a' ? 'b' : 'a';
  const el = document.getElementById(back);
  el.onload = () => {
    document.getElementById(back).classList.add('on');
    document.getElementById(front).classList.remove('on');
    front = back;
    const badge = document.getElementById('new');
    badge.classList.toggle('on', !!isNew);
  };
  el.src = url;
  document.getElementById('empty').hidden = true;
  document.getElementById('corner').hidden = false;
}

function tick() {
  if (fresh.length) { const p = fresh.shift(); photos.push(p); show(p.url, true); }
  else if (photos.length) { idx = (idx + 1) % photos.length; show(photos[idx].url, false); }
}

fetch(`/api/events/${code}/photos`).then(r => r.json()).then(list => {
  photos.push(...list);
  if (photos.length) show(photos[photos.length - 1].url, false);
});

// Live: new photos arrive from the server the moment the worker finishes them
const es = new EventSource(`/api/events/${code}/stream`);
es.onmessage = (m) => {
  const p = JSON.parse(m.data);
  const wasEmpty = !photos.length && !fresh.length;
  fresh.push(p);
  if (wasEmpty) tick();
};

setInterval(tick, SLIDE_MS);
</script>
</body>
</html>
